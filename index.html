<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Side Pane Studio</title>
    <style>
      /* Controls draw focus with border colour and box-shadow and set outline: none inline. Forced colours drop both. */
      @media (forced-colors: active) {
        :focus-visible { outline: 2px solid Highlight !important; outline-offset: 2px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition: none !important; animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
